services:
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      target: development
    container_name: mesahub-dev
    command: /app/start.sh
    ports:
      # Random host port -> container :80
      - "127.0.0.1::80"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=80
      # Admin panel password (min 8 chars)
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      # Data directory
      - DATA_PATH=/data
      # Storage limits
      - MAX_VOLUME_USAGE_PERCENT=${MAX_VOLUME_USAGE_PERCENT:-85}
      # File storage — always enabled; NEXT_PUBLIC_ controls the UI only
      - NEXT_PUBLIC_ENABLE_FILE_STORAGE=${NEXT_PUBLIC_ENABLE_FILE_STORAGE:-true}
      # Required for presigned file URL signing (separate from ADMIN_TOKEN)
      - FILE_TOKEN_SIGNING_SECRET=${FILE_TOKEN_SIGNING_SECRET}
      - FILE_MAX_SIZE_BYTES=${FILE_MAX_SIZE_BYTES:-104857600}
      - FILE_MAX_FILES_PER_DB=${FILE_MAX_FILES_PER_DB:-10000}
      - FILE_MAX_STORAGE_PER_DB_BYTES=${FILE_MAX_STORAGE_PER_DB_BYTES:-5368709120}
      - FILE_URL_SIGNING_SECRET=${FILE_URL_SIGNING_SECRET:-}
      - FILE_PRESIGN_DEFAULT_TTL_SECONDS=${FILE_PRESIGN_DEFAULT_TTL_SECONDS:-900}
      - FILE_PRESIGN_MAX_TTL_SECONDS=${FILE_PRESIGN_MAX_TTL_SECONDS:-86400}
      # SQL limits
      - MAX_SQL_LENGTH=${MAX_SQL_LENGTH:-100000}
      - MAX_SQL_BINDINGS=${MAX_SQL_BINDINGS:-5000}
    volumes:
      # Persistent data directory for SQLite DBs and file storage
      - mesahub-data:/data
      # Dev mode: mount dashboard source code for hot reload
      - ./dashboard/src:/app/dashboard/src:ro
      - ./dashboard/public:/app/dashboard/public:ro
      - ./dashboard/package.json:/app/dashboard/package.json:ro
      - ./dashboard/next.config.js:/app/dashboard/next.config.js:ro
      - ./dashboard/tsconfig.json:/app/dashboard/tsconfig.json:ro
      - ./dashboard/postcss.config.cjs:/app/dashboard/postcss.config.cjs:ro
      - ./dashboard/components.json:/app/dashboard/components.json:ro
      # Persist node_modules and .next build cache
      - node_modules:/app/dashboard/node_modules
      - nextjs-cache:/app/dashboard/.next
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  app-prod:
    profiles: ["prod"]
    build:
      context: .
      target: production
    container_name: sqlite-hub-prod
    command: /app/start.sh
    ports:
      - "${PORT:-8080}:80"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=80
      # Admin panel password (min 8 chars)
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      # Data directory
      - DATA_PATH=/data
      # Storage limits
      - MAX_VOLUME_USAGE_PERCENT=${MAX_VOLUME_USAGE_PERCENT:-85}
      # File storage — always enabled; NEXT_PUBLIC_ controls the UI only
      - NEXT_PUBLIC_ENABLE_FILE_STORAGE=${NEXT_PUBLIC_ENABLE_FILE_STORAGE:-true}
      # Required for presigned file URL signing (separate from ADMIN_TOKEN)
      - FILE_TOKEN_SIGNING_SECRET=${FILE_TOKEN_SIGNING_SECRET}
      - FILE_MAX_SIZE_BYTES=${FILE_MAX_SIZE_BYTES:-104857600}
      - FILE_MAX_FILES_PER_DB=${FILE_MAX_FILES_PER_DB:-10000}
      - FILE_MAX_STORAGE_PER_DB_BYTES=${FILE_MAX_STORAGE_PER_DB_BYTES:-5368709120}
      - FILE_URL_SIGNING_SECRET=${FILE_URL_SIGNING_SECRET:-}
      - FILE_PRESIGN_DEFAULT_TTL_SECONDS=${FILE_PRESIGN_DEFAULT_TTL_SECONDS:-900}
      - FILE_PRESIGN_MAX_TTL_SECONDS=${FILE_PRESIGN_MAX_TTL_SECONDS:-86400}
      # SQL limits
      - MAX_SQL_LENGTH=${MAX_SQL_LENGTH:-100000}
      - MAX_SQL_BINDINGS=${MAX_SQL_BINDINGS:-5000}
    volumes:
      # Persistent data directory for SQLite DBs and file storage
      - mesahub-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mesahub-data:
    driver: local
  node_modules:
  nextjs-cache:
