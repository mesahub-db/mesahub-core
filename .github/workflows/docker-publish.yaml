name: Build & Deploy

on:
  workflow_run:
    workflows:
      - Check
    branches:
      - trunk
    types:
      - completed
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      # Check out the parent monorepo with all submodules so the Docker build
      # context has access to packages/ (needed by core/admin) in addition to
      # the core/ module itself.
      - name: Checkout sqlite-hub monorepo
        uses: actions/checkout@v4
        with:
          repository: 0xdps/sqlite-hub
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/0xdps/mesahub-core
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Build context is the monorepo root — Dockerfile uses paths like
          # COPY core/admin/... and COPY packages/ that require the full tree.
          context: .
          file: ./core/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_ENABLE_FILE_STORAGE=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build-and-push
    # Only run if the Railway service ID secret is configured.
    if: ${{ vars.RAILWAY_SERVICE_ID != '' }}
    steps:
      - name: Trigger Railway redeploy
        run: |
          curl -sf -X POST \
            https://backboard.railway.app/graphql/v2 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -d '{"query": "mutation { serviceInstanceRedeploy(serviceId: \"${{ vars.RAILWAY_SERVICE_ID }}\") }"}'
