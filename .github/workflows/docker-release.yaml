name: Docker Release

# Triggered by a version tag on mesahub-core (e.g. v1.2.3).
# Checks out the full mono context and builds + pushes the mesahub-core image.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: mesahub-db
  IMAGE_SOURCE: https://github.com/mesahub-db/mesahub-core

jobs:
  build-core:
    name: Build mesahub-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout mesahub-mono
        uses: actions/checkout@v4
        with:
          repository: mesahub-db/mesahub-mono
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          fetch-depth: 0

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Extract metadata (core)
        id: meta-core
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mesahub-core
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push mesahub-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./core/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          cache-from: |
            type=gha,scope=mesahub-core
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mesahub-core:latest
          cache-to: type=gha,mode=max,scope=mesahub-core
          build-args: |
            NEXT_PUBLIC_ENABLE_FILE_STORAGE=true
